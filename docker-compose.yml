# 基础设施统一入口：Ollama + Milvus
# Milvus 官方成熟配置在 infrastructure/milvus/docker-compose.yml（此处 include 引入，不做改动）
# 仅启动 Ollama：docker compose up -d ollama
# 全部启动：    docker compose up -d
include:
  - infrastructure/milvus/docker-compose.yml

services:
  ollama:
    image: ollama/ollama:latest
    container_name: obsidianmind-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
