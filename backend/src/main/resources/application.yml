server:
  port: 8080

spring:
  application:
    name: ObsidianMind
  servlet:
    multipart:
      enabled: false

obsidian:
  vault:
    # 默认 Vault 路径，可为空（用户通过 POST /api/v1/vault/connect 显式指定）
    path: ${OBSIDIAN_VAULT_PATH:}

ai:
  provider: ${AI_PROVIDER:ollama}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:qwen3}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding}
    # 健康检查 / 请求超时（秒），Ollama 不可用不能拖垮主应用
    timeout-seconds: 3

milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  timeout-seconds: 2

cors:
  # 开发环境允许本地前端来源；生产必须通过环境变量显式收敛
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:9527}

logging:
  level:
    com.obsidianmind: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
